<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161514" />
    <title>UncleMelo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var saved = localStorage.getItem("unclemelo-theme")
        var hour = new Date().getHours()
        var auto = hour >= 18 || hour < 7 ? "night" : "day"
        var theme = saved === "night" || saved === "day" ? saved : auto
        document.documentElement.setAttribute("data-theme", theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
